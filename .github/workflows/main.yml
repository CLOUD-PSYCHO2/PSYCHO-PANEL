name: PSYCHO

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389

          Restart-Service -Name TermService -Force

      - name: Create Custom User & Hide/Disable runneradmin
        run: |
          $username = "CLOUD_PSYCHO"
          $password = "PSYCHO@123"
          
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          
          # ১. নতুন ইউজার তৈরি বা পাসওয়ার্ড সেট করা
          if (-not (Get-LocalUser -Name $username -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name $username -Password $securePass -AccountNeverExpires
              Add-LocalGroupMember -Group "Administrators" -Member $username
              Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username
          } else {
              Set-LocalUser -Name $username -Password $securePass
          }
          
          # ২. runneradmin ইউজারকে Disable করে দেওয়া যাতে লগইন স্ক্রিনে না দেখায়
          Disable-LocalUser -Name "runneradmin" -ErrorAction SilentlyContinue

          # ৩. Windows Registry দিয়ে runneradmin ইউজারকে RDP/Login লিস্ট থেকে সম্পূর্ণ হাইড করা
          $RegPath = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon\SpecialAccounts\UserList"
          if (-not (Test-Path $RegPath)) {
              New-Item -Path $RegPath -Force
          }
          Set-ItemProperty -Path $RegPath -Name "runneradmin" -Value 0 -Type DWord -Force
          
          echo "RDP_USER=$username" >> $env:GITHUB_ENV
          echo "RDP_PASS=$password" >> $env:GITHUB_ENV

      - name: Install Tailscale
        run: |
          choco install tailscale -y

      - name: Establish Tailscale Connection
        run: |
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID
          
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 12) {
              Start-Sleep -Seconds 5
              $tsIP = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
              $retries++
          }
          
          if (-not $tsIP) {
              Write-Error "Tailscale IP assignment failed."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Create and Upload IP Artifact
        shell: powershell
        run: |
          $ip = $env:TAILSCALE_IP
          Write-Host "Tailscale IP: $ip"
          Set-Content -Path ip.txt -Value $ip

      - name: Upload IP Artifact for C# Tool
        uses: actions/upload-artifact@v4
        with:
          name: rdp-ip
          path: ip.txt

      - name: Verify RDP Accessibility
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed"
              exit 1
          }
          Write-Host "TCP connectivity successful!"

      - name: Maintain Connection
        run: |
          Write-Host "`n=========================================="
          Write-Host "RDP ADDRESS  : $env:TAILSCALE_IP"
          Write-Host "USERNAME     : $env:RDP_USER"
          Write-Host "PASSWORD     : $env:RDP_PASS"
          Write-Host "==========================================`n"
          
          while ($true) {
              Write-Host "[$(Get-Date -Format 'HH:mm:ss')] RDP Active..."
              Start-Sleep -Seconds 300
          }
